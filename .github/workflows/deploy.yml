name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build Docker image
        run: docker build -t 9ineflix-app .

      - name: Save Docker image
        run: docker save 9ineflix-app | gzip > 9ineflix-app.tar.gz

      - name: Copy Docker image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "9ineflix-app.tar.gz"
          target: "~/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Load the Docker image
            docker load < ~/9ineflix-app.tar.gz
            
            # Stop the existing container if it exists
            docker stop 9ineflix-app || true
            
            # Remove the existing container if it exists
            docker rm 9ineflix-app || true
            
            # Run the new container on port 3006
            docker run -d \
              --name 9ineflix-app \
              -p 3006:3006 \
              --restart unless-stopped \
              9ineflix-app
              
            # Clean up the tar file to save space
            rm ~/9ineflix-app.tar.gz
